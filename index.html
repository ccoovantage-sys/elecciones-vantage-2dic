<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elecciones Sindicales 2DIC | CCOO Vantage Towers España</title>
  <meta name="description" content="Portal oficial de la candidatura de CCOO para las Elecciones Sindicales del 2 de diciembre de 2026 en Vantage Towers España." />
  <style>
    :root {
      --ccoo-red: #D4001A;
      --ccoo-red-dark: #9E0013;
      --vantage-dark: #1A1E24;
      --vantage-slate: #2B323B;
      --vantage-blue: #0F4C81;
      --bg-page: #F2F4F7;
      --surface: #FFFFFF;
      --text-main: #1A1E24;
      --text-muted: #525B66;
      --accent-green: #18794E;
      --border: #E1E5EB;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.09);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Barra superior fija */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(26, 30, 36, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 3px solid var(--ccoo-red);
      padding: 0.65rem 1.25rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.22);
    }

    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .nav-logos {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: #fff;
    }

    .nav-logos img {
      height: 36px;
      width: auto;
      object-fit: contain;
      background: #fff;
      padding: 3px 6px;
      border-radius: 6px;
    }

    .nav-divider {
      width: 1px;
      height: 26px;
      background: rgba(255, 255, 255, 0.25);
    }

    .nav-links {
      display: flex;
      gap: 1.15rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav-links a {
      color: #E4E7EC;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .nav-btn-vota {
      background: var(--ccoo-red);
      color: #fff !important;
      padding: 0.45rem 0.95rem;
      border-radius: 6px;
      font-weight: 800 !important;
      letter-spacing: 0.4px;
    }

    /* Hero corporativo */
    .hero {
      background: linear-gradient(125deg, var(--ccoo-red-dark) 0%, var(--ccoo-red) 52%, var(--vantage-dark) 52.3%, var(--vantage-slate) 100%);
      color: #fff;
      padding: 3.5rem 1.25rem 4rem;
      position: relative;
    }

    .hero-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 2.25rem;
      align-items: center;
    }

    .hero-logos-box {
      display: inline-flex;
      align-items: center;
      gap: 0.9rem;
      background: #fff;
      padding: 0.55rem 1rem;
      border-radius: 10px;
      margin-bottom: 1.25rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
    }

    .hero-logos-box img {
      height: 40px;
      width: auto;
      object-fit: contain;
    }

    .hero-logos-sep {
      width: 1px;
      height: 28px;
      background: #D0D5DD;
    }

    .hero h1 {
      font-size: clamp(1.9rem, 3.5vw, 2.75rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 0.85rem;
      text-transform: uppercase;
    }

    .hero-slogan {
      font-size: 1.22rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      opacity: 0.96;
    }

    .hero-actions {
      display: flex;
      gap: 0.85rem;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: #fff;
      color: var(--ccoo-red);
      padding: 0.85rem 1.4rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      transition: transform 0.15s ease;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 0.85rem 1.4rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      transition: background 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    /* Tarjeta derecha del hero con cuenta atrás */
    .hero-widget {
      background: rgba(26, 30, 36, 0.72);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius);
      padding: 1.85rem;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
    }

    .widget-badge {
      display: inline-block;
      background: var(--ccoo-red);
      color: #fff;
      font-size: 0.
